<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Jogo da cobrinha moderno: teclado e toque, pausa, dificuldades, recorde e modo automático em que a IA joga até vencer."
    />
    <meta name="theme-color" content="#07231A" />
    <title>Cobrinha Arcade — Jogo da Snake</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M4 3h8v5H4v5h8' stroke='%234ADE80' stroke-width='2.4' fill='none' stroke-linecap='square'/%3E%3C/svg%3E"
    />
    <style>
      html {
        background: #07231a;
      }
      #root:empty::after {
        content: "Carregando a cobrinha…";
        display: block;
        padding-top: 42vh;
        text-align: center;
        color: #8fc7ab;
        font-family: "Trebuchet MS", sans-serif;
        font-size: 14px;
        letter-spacing: 0.12em;
      }
    </style>
    <!-- Vigia de boot: se o módulo principal não carregar, exibe aviso em vez de tela em branco -->
    <script>
      window.setTimeout(function () {
        try {
          var root = document.getElementById("root");
          if (root && !window.__APP_BOOTED__ && !root.childElementCount) {
            root.innerHTML =
              '<div style="min-height:100vh;display:grid;place-items:center;background:#07231a;color:#d9f0e4;font-family:Trebuchet MS,sans-serif;padding:24px;text-align:center">' +
              '<div style="max-width:440px">' +
              '<p style="font-family:Courier New,monospace;font-weight:bold;color:#FBBF24;letter-spacing:0.1em;margin:0 0 12px">FALHA AO CARREGAR O JOGO</p>' +
              '<p style="font-size:14px;opacity:0.85;line-height:1.55;margin:0">O ambiente bloqueou o carregamento. Recarregue para tentar de novo.</p>' +
              '<button type="button" onclick="location.reload()" style="margin-top:22px;padding:12px 24px;border-radius:10px;border:none;border-bottom:4px solid #B45309;background:#FBBF24;color:#3A2A05;font-weight:bold;cursor:pointer">RECARREGAR</button>' +
              "</div></div>";
          }
        } catch (e) {}
      }, 7000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
